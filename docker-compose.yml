services:
  db:
    image: pgvector/pgvector:pg16
    container_name: scai-db
    environment:
      POSTGRES_USER: scai
      POSTGRES_DB: scai
      POSTGRES_PASSWORD: ${SCAI_DB_PASSWORD:-scaipassword}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scai_pgdata:/var/lib/postgresql/data
      - ./infra/docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scai -d scai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scai_pgdata:
