[project]
name = "supply-chain-ai"
version = "0.1.0"
description = "AI-powered Supply Chain Risk & Logistics Intelligence"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.20.0",
  "pgvector>=0.5.0",
  "psycopg[binary]>=3.3.6",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.1.1",
  "structlog>=24.1",
]

[dependency-groups]
dev = [
  "pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.23", "hypothesis>=6",
  "ruff>=0.6", "mypy>=1.11", "bandit>=1.7",
  "import-linter>=2.0", "pre-commit>=3.8", "commitizen>=3.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scai"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S", "C4", "SIM", "RUF", "PT", "ASYNC", "DTZ", "PTH", "T20", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -ra --cov=scai --cov-report=term-missing"
markers = [
  "unit: fast, no I/O",
  "integration: needs real services (Postgres, etc.)",
  "contract: verifies port/adapter or MCP tool contracts",
]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.importlinter]
root_package = "scai"

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["scai.domain"]
forbidden_modules = ["scai.application", "scai.adapters", "scai.api", "scai.agents", "scai.mcp_servers", "scai.ui"]

[[tool.importlinter.contracts]]
name = "Application does not depend on outer layers"
type = "forbidden"
source_modules = ["scai.application"]
forbidden_modules = ["scai.adapters", "scai.api", "scai.agents", "scai.mcp_servers", "scai.ui"]

[[tool.importlinter.contracts]]
name = "Entrypoints are independent"
type = "independence"
modules = ["scai.api", "scai.ui", "scai.agents", "scai.mcp_servers"]
